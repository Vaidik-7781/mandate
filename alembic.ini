[alembic]
script_location = alembic
prepend_sys_path = apps/api
# the URL comes from MANDATE_DATABASE_URL (see alembic/env.py), never from this file

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
