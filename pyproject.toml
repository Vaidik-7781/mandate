[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate"
version = "0.1.0"
description = "Mandate: an open accountability layer for agent purchases on PayPal (prove, protect, resolve, attribute)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "starlette>=0.40,<2",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "cryptography>=43",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  # The Verifiable Intent reference implementation is vendored in apps/api/verifiable_intent (see VENDORED.md).
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "alembic", "apps/api/verifiable_intent"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S102"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["apps/api/mandate"]
exclude = ["apps/api/verifiable_intent"]

[tool.ruff.format]
line-ending = "lf"
